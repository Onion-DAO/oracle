name: Deploy website

# main + manual dispatch deploy to production, pull requests only build
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'firebase.json'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'firebase.json'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy halfway, queue instead
concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Build website' || 'Deploy website' }}

    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Cloning repository
        uses: actions/checkout@v7

      # Node version and npm cache both follow website/
      - name: Set up Node.js (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Build website files
        env:
          NODE_ENV: production
        run: npm run build
        working-directory: website

      # The secret is service account JSON, either raw or base64 encoded
      - name: Write GCP credentials
        if: github.event_name != 'pull_request'
        env:
          GCP_SA_KEY: ${{ secrets.SERVICE_ACCOUNT_PRODUCTION }}
        run: |
          key_file="$RUNNER_TEMP/gcp-key.json"
          key="${GCP_SA_KEY#"${GCP_SA_KEY%%[![:space:]]*}"}"

          umask 077
          if [[ "$key" == '{'* ]]; then
            printf '%s\n' "$key" > "$key_file"
          else
            printf '%s' "$key" | tr -d '[:space:]' | base64 -d > "$key_file" 2>/dev/null || true
          fi

          if [[ ! -s "$key_file" ]] || ! jq -e .client_email "$key_file" > /dev/null 2>&1; then
            rm -f "$key_file"
            echo "::error::SERVICE_ACCOUNT_PRODUCTION is not service account JSON (raw or base64 encoded)"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$key_file" >> "$GITHUB_ENV"

      - name: Deploy to Firebase
        if: github.event_name != 'pull_request'
        run: npx --yes firebase-tools@15.32.1 deploy --only hosting --project production --non-interactive

      - name: Send push notification
        if: github.event_name != 'pull_request' && success()
        continue-on-error: true
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          curl -fsS https://api.pushover.net/1/messages.json \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=Success: OnionDAO Website" \
            --form-string "message=website CI success" \
            --form-string "priority=1"

      - name: Send failure push notification
        if: github.event_name != 'pull_request' && failure()
        continue-on-error: true
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          curl -fsS https://api.pushover.net/1/messages.json \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=Failure: OnionDAO Website" \
            --form-string "message=website CI failed" \
            --form-string "priority=1"
